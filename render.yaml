# Render blueprint for the BitNex API (the FastAPI backend).
# The frontend is deployed separately on Vercel from ./frontend.
services:
  - type: web
    name: bitnex-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Secrets: set these in the Render dashboard, never in this file.
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Must list the exact Vercel origin: the API sends credentials,
      # and browsers reject "*" on credentialed requests.
      - key: CORS_ORIGINS
        sync: false
